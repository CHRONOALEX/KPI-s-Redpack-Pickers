<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Picking - Dashboard Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lexend', sans-serif; background-color: #121212; color: #e2e8f0; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .table-container { background: #1e1e1e; width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: #2d2d2d; color: #94a3b8; padding: 10px; text-align: left; font-size: 0.65rem; text-transform: uppercase; border-bottom: 2px solid #404040; cursor: pointer; }
        tbody td { padding: 8px; font-size: 0.75rem; border-bottom: 1px solid #2d2d2d; }
        .kpi-card { background: #1e1e1e; border-radius: 8px; border: 1px solid #333; overflow: hidden; }
        
        /* Estilos 100% */
        .perfect-100 { background-color: #ffd700 !important; color: black !important; font-weight: 800 !important; }
        .perfect-100 td, .perfect-100 td div { color: black !important; }

        @keyframes psp-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .psp-header { padding: 12px; font-weight: 800; text-transform: uppercase; background-size: 200% auto; animation: psp-shimmer 4s linear infinite; color: white; display: flex; justify-content: space-between; align-items: center; }
        .bg-muelle { background-image: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 50%, #1e3a8a 100%); }
        .bg-etiquetado { background-image: linear-gradient(90deg, #581c87 0%, #a855f7 50%, #581c87 100%); }
        .bg-inyeccion { background-image: linear-gradient(90deg, #7c2d12 0%, #f97316 50%, #7c2d12 100%); }
        
        header { background-color: #630d0d; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        
        .bar-label { font-size: 8px; fill: #94a3b8; font-weight: 600; }
        .bar-value { font-size: 9px; fill: #fff; font-weight: 800; }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white mb-4"></div>
        <h2 class="text-lg font-bold">Cargando Datos...</h2>
    </div>

    <header class="p-4 shadow-xl border-b border-red-900">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-white">KPI PICKING DASHBOARD</h1>
            <div class="flex items-center gap-4">
                <select id="global-sort" onchange="processData()" class="bg-black/40 text-white text-xs rounded p-2 border border-red-900 outline-none font-bold cursor-pointer">
                    <option value="eficiencia">Ordenar por Eficiencia</option>
                    <option value="pph">Ordenar por PPH</option>
                </select>
                <button onclick="fetchExcel()" class="bg-white text-red-900 font-black text-xs py-2 px-4 rounded hover:bg-red-100 transition-all shadow-lg">REFRESCAR</button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto p-4 space-y-6">
        <div class="dashboard-grid">
            <div class="kpi-card">
                <div class="psp-header bg-muelle"><span>Muelle</span></div>
                <div id="chart-muelle" class="w-full h-[120px] px-2 py-2 bg-[#1e1e1e]"></div>
                <div class="table-container">
                    <table id="table-muelle">
                        <thead><tr><th>Nombre</th><th class="text-center">Paq</th><th class="text-center">Err</th><th class="text-center">Ef%</th><th class="text-center">PPH</th></tr></thead>
                        <tbody id="body-muelle"></tbody>
                    </table>
                </div>
            </div>
            <div class="kpi-card">
                <div class="psp-header bg-inyeccion"><span>Inyección</span></div>
                <div id="chart-inyeccion" class="w-full h-[120px] px-2 py-2 bg-[#1e1e1e]"></div>
                <div class="table-container">
                    <table id="table-inyeccion">
                        <thead><tr><th>Nombre</th><th class="text-center">Paq</th><th class="text-center">Err</th><th class="text-center">Ef%</th><th class="text-center">PPH</th></tr></thead>
                        <tbody id="body-inyeccion"></tbody>
                    </table>
                </div>
            </div>
            <div class="kpi-card">
                <div class="psp-header bg-etiquetado"><span>Etiquetado</span></div>
                <div id="chart-etiquetado" class="w-full h-[120px] px-2 py-2 bg-[#1e1e1e]"></div>
                <div class="table-container">
                    <table id="table-etiquetado">
                        <thead><tr><th>Nombre</th><th class="text-center">Paq</th><th class="text-center">Err</th><th class="text-center">Ef%</th><th class="text-center">PPH</th></tr></thead>
                        <tbody id="body-etiquetado"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const XLSX_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRrIh0lDXr8oz48UNU56X6iUV_f04YpsgwF8pULjOIrQ9tUREu0ehPoT2OHoDOVw1BCAS1VOndiU1ri/pub?output=xlsx';
        let rawRows = [];

        async function fetchExcel() {
            document.getElementById('loader').style.display = 'flex';
            try {
                const response = await fetch(XLSX_URL + '&cache=' + new Date().getTime());
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
                rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                processData();
            } catch (e) { console.error(e); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        function processData() {
            const sortBy = document.getElementById('global-sort').value;
            const groups = { muelle: {}, inyeccion: {}, etiquetado: {} };

            rawRows.forEach(row => {
                const nombre = String(row['Colaborador'] || "");
                if (!nombre) return;
                const proceso = String(row['Proceso'] || "").toLowerCase();
                let type = proceso.includes('muelle') ? 'muelle' : (proceso.includes('inyeccion') || proceso.includes('inyección')) ? 'inyeccion' : proceso.includes('etiquetado') ? 'etiquetado' : null;

                if (type) {
                    if (!groups[type][nombre]) groups[type][nombre] = { nombre, paquetes: 0, errores: 0, filas: 0 };
                    const s = groups[type][nombre];
                    s.paquetes += parseFloat(row['Paquetes'] || 0);
                    s.errores += parseFloat(row['Errores'] || 0);
                    s.filas++;
                }
            });

            Object.keys(groups).forEach(type => {
                const processed = Object.values(groups[type]).map(s => ({
                    ...s,
                    eficiencia: s.paquetes > 0 ? ((s.paquetes - s.errores) / s.paquetes) * 100 : 0,
                    pph: s.paquetes / (s.filas || 1)
                })).sort((a, b) => b[sortBy] - a[sortBy]);

                renderTable(type, processed);
                renderChart(type, processed.slice(0, 3), sortBy);
            });
        }

        function renderChart(type, data, sortBy) {
            const wrapper = document.getElementById(`chart-${type}`);
            const maxVal = data.length > 0 ? data[0][sortBy] : 1;
            const color = type === 'muelle' ? '#3b82f6' : type === 'inyeccion' ? '#f97316' : '#a855f7';

            let svg = `<svg width="100%" height="100%" viewBox="0 0 300 120" preserveAspectRatio="none">
                <defs><filter id="glow-${type}"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="${color}"/></filter></defs>`;
            
            data.forEach((item, i) => {
                const barWidth = (item[sortBy] / maxVal) * 140;
                const y = 20 + (i * 30);
                svg += `
                    <rect x="70" y="${y}" width="${barWidth}" height="15" rx="2" fill="${color}" filter="url(#glow-${type})" />
                    <text x="65" y="${y + 11}" text-anchor="end" class="bar-label">${item.nombre.split(' ')[0]}</text>
                    <text x="${75 + barWidth}" y="${y + 11}" class="bar-value">${item[sortBy].toFixed(2)}${sortBy === 'eficiencia' ? '%' : ''}</text>
                `;
            });
            wrapper.innerHTML = svg + `</svg>`;
        }

        function renderTable(type, data) {
            const body = document.getElementById(`body-${type}`);
            body.innerHTML = data.map(s => `
                <tr class="${s.eficiencia >= 100 ? 'perfect-100' : ''}">
                    <td class="font-bold">${s.eficiencia >= 100 ? '★ ' : ''}${s.nombre}</td>
                    <td class="text-center">${s.paquetes.toFixed(2)}</td>
                    <td class="text-center">${s.errores.toFixed(2)}</td>
                    <td class="text-center font-bold">${s.eficiencia.toFixed(2)}%</td>
                    <td class="text-center">${s.pph.toFixed(2)}</td>
                </tr>`).join('');
        }

        window.onload = fetchExcel;
    </script>
</body>
</html>
