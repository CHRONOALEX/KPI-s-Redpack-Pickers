<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Picking - Dashboard Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lexend', sans-serif; background-color: #121212; color: #e2e8f0; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .table-container { background: #1e1e1e; width: 100%; }
        table { width: 100%; border-collapse: collapse; table-layout: auto; }
        thead th { position: sticky; top: 0; background: #2d2d2d; color: #94a3b8; padding: 8px; text-align: left; font-size: 0.65rem; text-transform: uppercase; z-index: 10; border-bottom: 2px solid #404040; cursor: pointer; }
        tbody td { padding: 8px; font-size: 0.75rem; color: #cbd5e1; border-bottom: 1px solid #2d2d2d; }
        .kpi-card { background: #1e1e1e; border-radius: 8px; border: 1px solid #333; }
        
        @keyframes psp-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .psp-header { padding: 12px; font-weight: 800; text-transform: uppercase; background-size: 200% auto; animation: psp-shimmer 4s linear infinite; color: white; display: flex; justify-content: space-between; align-items: center; }
        .bg-muelle { background-image: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 50%, #1e3a8a 100%); }
        .bg-etiquetado { background-image: linear-gradient(90deg, #581c87 0%, #a855f7 50%, #581c87 100%); }
        .bg-inyeccion { background-image: linear-gradient(90deg, #7c2d12 0%, #f97316 50%, #7c2d12 100%); }
        
        .perfect-pick { background: rgba(255, 215, 0, 0.1) !important; border-left: 4px solid #ffd700; }
        
        /* Efecto Dorado 100% */
        @keyframes gold-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .gold-shine { background: linear-gradient(90deg, #1e1e1e 0%, #3d2b00 50%, #1e1e1e 100%); background-size: 200% 100%; animation: gold-shimmer 3s linear infinite; border-left: 4px solid #ffd700; }

        header { background-color: #630d0d; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .mini-bar { height: 6px; border-radius: 3px; background: #333; overflow: hidden; width: 100%; }
        .mini-bar-fill { height: 100%; transition: width 0.5s ease-in-out; }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white mb-4"></div>
        <h2 class="text-lg font-bold">Analizando Productividad...</h2>
    </div>

    <header class="p-4 shadow-xl border-b border-red-900">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="text-xl font-extrabold text-white">PICKING KPI DASHBOARD</h1>
                    <p class="text-red-200 text-xs">Métrica Avanzada de Eficiencia</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-black/40 p-1 rounded-lg border border-red-900/50">
                    <span class="text-[10px] font-bold text-red-300 ml-2">ORDENAR POR:</span>
                    <select id="global-sort" onchange="updateGlobalSort()" class="bg-transparent text-white text-xs rounded p-1 outline-none font-bold cursor-pointer">
                        <option value="eficiencia">Eficiencia (%)</option>
                        <option value="pph">Paquetes por Hora (PPH)</option>
                    </select>
                </div>
                <select id="filter-semana" onchange="applyFilters()" class="bg-black/30 border border-red-400 text-white text-xs rounded p-2 outline-none">
                    <option value="all">Semanas</option>
                </select>
                <button onclick="fetchExcel()" class="bg-white text-red-900 font-black text-xs py-2 px-4 rounded hover:bg-red-100 transition-all shadow-lg">ACTUALIZAR</button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto p-4 space-y-6">
        
        <section id="top-section" class="grid grid-cols-3 gap-4"></section>

        <div class="dashboard-grid">
            <div class="kpi-card">
                <div class="psp-header bg-muelle">
                    <span>1. MUELLE</span>
                    <span id="label-muelle" class="text-[10px] bg-black/20 px-2 py-1 rounded">0</span>
                </div>
                <div class="table-container">
                    <table id="table-muelle">
                        <thead><tr><th onclick="sortTable('muelle', 0)">Nombre</th><th>Rango</th><th class="text-center">Rut</th><th class="text-center">Paq</th><th class="text-center">Err</th><th class="text-center">Ef%</th><th class="text-center">PPH</th></tr></thead>
                        <tbody id="body-muelle"></tbody>
                    </table>
                </div>
            </div>

            <div class="kpi-card">
                <div class="psp-header bg-inyeccion">
                    <span>2. INYECCIÓN</span>
                    <span id="label-inyeccion" class="text-[10px] bg-black/20 px-2 py-1 rounded">0</span>
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th onclick="sortTable('inyeccion', 0)">Nombre</th><th>Rango</th><th class="text-center">Paq</th><th class="text-center">Dañ</th><th class="text-center">Ef%</th><th class="text-center">PPH</th></tr></thead>
                        <tbody id="body-inyeccion"></tbody>
                    </table>
                </div>
            </div>

            <div class="kpi-card">
                <div class="psp-header bg-etiquetado">
                    <span>3. ETIQUETADO</span>
                    <span id="label-etiquetado" class="text-[10px] bg-black/20 px-2 py-1 rounded">0</span>
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th onclick="sortTable('etiquetado', 0)">Nombre</th><th>Rango</th><th class="text-center">Paq</th><th class="text-center">Err</th><th class="text-center">Ef%</th><th class="text-center">PPH</th></tr></thead>
                        <tbody id="body-etiquetado"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const XLSX_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRrIh0lDXr8oz48UNU56X6iUV_f04YpsgwF8pULjOIrQ9tUREu0ehPoT2OHoDOVw1BCAS1VOndiU1ri/pub?output=xlsx';
        let rawRows = [];
        let tablesData = { muelle: [], inyeccion: [], etiquetado: [] };
        let currentSort = "eficiencia";

        async function fetchExcel() {
            document.getElementById('loader').style.display = 'flex';
            try {
                const response = await fetch(XLSX_URL + '&cache=' + new Date().getTime());
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
                const sheetName = workbook.SheetNames.find(n => n.includes('Picking')) || workbook.SheetNames[0];
                rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });
                populateWeeks();
                processData();
            } catch (e) { console.error(e); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        function findKey(row, name) {
            const normalizeStr = (str) => String(str).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s/g, '');
            const target = normalizeStr(name);
            return Object.keys(row).find(k => normalizeStr(k) === target) || "";
        }

        function populateWeeks() {
            const col = findKey(rawRows[0], 'Semana');
            const weeks = [...new Set(rawRows.map(r => r[col]).filter(w => w !== ""))].sort((a,b) => a-b);
            const select = document.getElementById('filter-semana');
            select.innerHTML = '<option value="all">Semanas</option>';
            weeks.forEach(w => select.innerHTML += `<option value="${w}">Semana ${w}</option>`);
        }

        function applyFilters() { processData(); }

        function updateGlobalSort() {
            currentSort = document.getElementById('global-sort').value;
            processData();
        }

        function processData() {
            const selectedWeek = document.getElementById('filter-semana').value;
            const groups = { muelle: {}, inyeccion: {}, etiquetado: {} };

            rawRows.forEach(row => {
                const colSemana = findKey(row, 'Semana');
                if (selectedWeek !== "all" && String(row[colSemana]) !== selectedWeek) return;

                const proceso = String(row[findKey(row, 'Proceso de Trabajo')]).toLowerCase();
                const nombre = String(row[findKey(row, 'Colaborador')]);
                if (!nombre) return;

                let type = "";
                if (proceso.includes('muelle')) type = 'muelle';
                else if (proceso.includes('inyeccion') || proceso.includes('inyección')) type = 'inyeccion';
                else if (proceso.includes('etiquetado')) type = 'etiquetado';

                if (type) {
                    if (!groups[type][nombre]) {
                        groups[type][nombre] = { nombre, ranges: new Set(), rutas: 0, paquetes: 0, errores: 0, totalFilas: 0 };
                    }
                    const s = groups[type][nombre];
                    const rVal = String(row[findKey(row, 'Rango de Trabajo')]);
                    rVal.split(',').forEach(l => { if(l.trim()) s.ranges.add(l.trim()); });
                    if (type === 'muelle') s.rutas += parseFloat(row[findKey(row, 'Rutas x Colaborador')]) || 0;
                    s.paquetes += parseFloat(row[findKey(row, 'Paquetes Procesados x Colaborador')]) || 0;
                    if (type === 'inyeccion') s.errores += parseFloat(row[findKey(row, 'Paquetes Dañados/ SC')]) || 0;
                    else if (type === 'muelle') s.errores += parseFloat(row[findKey(row, 'Errores Muelle')]) || 0;
                    else s.errores += parseFloat(row[findKey(row, 'Errores Etiquetado')]) || 0;
                    s.totalFilas++;
                }
            });

            Object.keys(groups).forEach(type => {
                tablesData[type] = Object.values(groups[type]).map(s => {
                    let ef = s.paquetes > 0 ? ((s.paquetes - s.errores) / s.paquetes) * 100 : 0;
                    if (s.errores > 0 && ef > 99.9) ef = 99.9; 
                    return { ...s, rango: Array.from(s.ranges).join(','), eficiencia: ef, pph: Math.round(s.paquetes / (s.totalFilas || 1)) };
                });
                tablesData[type].sort((a, b) => b[currentSort] - a[currentSort]);
                renderTable(type);
            });
            renderTops();
        }

        function renderTops() {
            const container = document.getElementById('top-section');
            container.innerHTML = "";
            ['muelle', 'inyeccion', 'etiquetado'].forEach((type) => {
                const top = tablesData[type][0];
                if (!top) return;
                const color = type === 'muelle' ? '#3b82f6' : type === 'inyeccion' ? '#f97316' : '#a855f7';
                container.innerHTML += `
                    <div class="kpi-card p-4 border-l-4" style="border-color: ${color}">
                        <div class="flex justify-between mb-3">
                            <div>
                                <h4 class="text-white font-black text-sm uppercase">🥇 ${top.nombre}</h4>
                                <p class="text-[9px] text-gray-500 font-bold">${type.toUpperCase()}</p>
                            </div>
                            <span class="text-[10px] bg-white/10 text-white px-2 py-1 rounded h-fit font-bold">#1 ${currentSort.toUpperCase()}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="text-[10px] text-gray-400 mb-1">EFICIENCIA</p>
                                <p class="text-lg font-extrabold text-white">${top.eficiencia.toFixed(1)}%</p>
                                <div class="mini-bar mt-1"><div class="mini-bar-fill" style="width: ${top.eficiencia}%; background: ${color}"></div></div>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-400 mb-1">PPH (PAQ/HR)</p>
                                <p class="text-lg font-extrabold text-white">${top.pph}</p>
                                <p class="text-[9px] text-emerald-400 font-bold">↑ RENDIMIENTO</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderTable(type) {
            const el = document.getElementById(`label-${type}`);
            if (el) el.innerText = tablesData[type].length;
            const body = document.getElementById(`body-${type}`);
            body.innerHTML = tablesData[type].map(s => {
                // Lógica de clase de fila (Efecto dorado si >= 100)
                let rowClass = "";
                if (s.eficiencia >= 100) rowClass = "gold-shine";
                else if (s.errores === 0 && s.paquetes > 500) rowClass = "perfect-pick";
                
                // Lógica de color de texto eficiencia
                let efColor = "text-red-500";
                if (s.eficiencia >= 100) efColor = "text-green-500";
                else if (s.eficiencia >= 99) efColor = "text-yellow-400";
                
                return `
                <tr class="${rowClass}">
                    <td class="font-bold text-white">${s.nombre}</td>
                    <td class="text-[10px] text-gray-400">${s.rango}</td>
                    ${type === 'muelle' ? `<td class="text-center font-bold text-blue-400">${s.rutas}</td>` : ''}
                    <td class="text-center font-bold text-emerald-400">${s.paquetes.toLocaleString()}</td>
                    <td class="text-center text-red-400">${s.errores}</td>
                    <td class="text-center ${efColor} font-bold">${s.eficiencia.toFixed(1)}%</td>
                    <td class="text-center text-white font-bold">${s.pph}</td>
                </tr>`;
            }).join('');
        }

        function sortTable(type, colIndex) {
            const keys = type === 'muelle' ? ['nombre', 'rango', 'rutas', 'paquetes', 'errores', 'eficiencia', 'pph'] : ['nombre', 'rango', 'paquetes', 'errores', 'eficiencia', 'pph'];
            const key = keys[colIndex];
            tablesData[type].sort((a, b) => b[key] - a[key]);
            renderTable(type);
        }

        window.onload = fetchExcel;
    </script>
</body>
</html>
