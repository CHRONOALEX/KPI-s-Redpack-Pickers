<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Picking - Dashboard Real-Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Lexend', sans-serif; 
            background-color: #121212; 
            color: #e2e8f0;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            align-items: start;
        }

        .table-container { 
            overflow-x: auto; 
            max-height: 650px; 
            background: #1e1e1e;
        }

        table { width: 100%; border-collapse: collapse; }
        thead th { 
            position: sticky; top: 0; background: #2d2d2d; color: #94a3b8; 
            padding: 10px; text-align: left; font-size: 0.65rem; text-transform: uppercase;
            z-index: 10; border-bottom: 2px solid #404040; cursor: pointer;
        }
        thead th:hover { color: white; background: #3d3d3d; }
        tbody tr { border-bottom: 1px solid #2d2d2d; }
        tbody tr:hover { background-color: #262626; }
        tbody td { padding: 10px; font-size: 0.75rem; color: #cbd5e1; }

        .kpi-card { 
            background: #1e1e1e; border-radius: 8px; overflow: hidden; 
            border: 1px solid #333; height: 100%;
        }

        @keyframes psp-shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .psp-header {
            padding: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background-size: 200% auto;
            animation: psp-shimmer 4s linear infinite;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bg-muelle { background-image: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 50%, #1e3a8a 100%); }
        .bg-etiquetado { background-image: linear-gradient(90deg, #581c87 0%, #a855f7 50%, #581c87 100%); }
        .bg-inyeccion { background-image: linear-gradient(90deg, #7c2d12 0%, #f97316 50%, #7c2d12 100%); }

        .status-badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; }
        
        header { background-color: #630d0d; }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white mb-4"></div>
        <h2 class="text-lg font-bold">Procesando Datos...</h2>
    </div>

    <header class="p-4 shadow-xl border-b border-red-900">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-extrabold tracking-tighter text-white">PICKING KPI DASHBOARD</h1>
                <p class="text-red-200 text-xs opacity-80">Última Milla Redpack - Picking</p>
            </div>
            <div class="flex items-center gap-4">
                <select id="filter-semana" onchange="applyFilters()" class="bg-black/30 border border-red-400 text-white text-xs rounded p-2 outline-none">
                    <option value="all">Semanas</option>
                </select>
                <button onclick="fetchExcel()" class="bg-white text-red-900 font-black text-xs py-2 px-4 rounded hover:bg-red-100 transition-all">
                    ACTUALIZAR
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto p-4">
        <div class="dashboard-grid">
            
            <!-- TABLERO MUELLE -->
            <div class="kpi-card">
                <div class="psp-header bg-muelle">
                    <span>1. MUELLE</span>
                    <span id="label-muelle" class="text-[10px] bg-black/20 px-2 py-1 rounded">0</span>
                </div>
                <div class="table-container">
                    <table id="table-muelle">
                        <thead>
                            <tr>
                                <th onclick="sortTable('muelle', 0)">Nombre</th>
                                <th onclick="sortTable('muelle', 1)">Rango</th>
                                <th onclick="sortTable('muelle', 2)" class="text-center">Rut</th>
                                <th onclick="sortTable('muelle', 3)" class="text-center">Paq</th>
                                <th onclick="sortTable('muelle', 4)" class="text-center">Err</th>
                                <th onclick="sortTable('muelle', 5)" class="text-center">Ef%</th>
                                <th onclick="sortTable('muelle', 6)" class="text-center">PPH</th>
                                <th onclick="sortTable('muelle', 7)" class="text-center">Días</th>
                            </tr>
                        </thead>
                        <tbody id="body-muelle"></tbody>
                    </table>
                </div>
            </div>

            <!-- TABLERO INYECCIÓN -->
            <div class="kpi-card">
                <div class="psp-header bg-inyeccion">
                    <span>2. INYECCIÓN</span>
                    <span id="label-inyeccion" class="text-[10px] bg-black/20 px-2 py-1 rounded">0</span>
                </div>
                <div class="table-container">
                    <table id="table-inyeccion">
                        <thead>
                            <tr>
                                <th onclick="sortTable('inyeccion', 0)">Nombre</th>
                                <th onclick="sortTable('inyeccion', 1)">Rango</th>
                                <th onclick="sortTable('inyeccion', 2)" class="text-center">Paq</th>
                                <th onclick="sortTable('inyeccion', 3)" class="text-center">Dañ</th>
                                <th onclick="sortTable('inyeccion', 4)" class="text-center">Ef%</th>
                                <th onclick="sortTable('inyeccion', 5)" class="text-center">PPH</th>
                                <th onclick="sortTable('inyeccion', 6)" class="text-center">Días</th>
                            </tr>
                        </thead>
                        <tbody id="body-inyeccion"></tbody>
                    </table>
                </div>
            </div>

            <!-- TABLERO ETIQUETADO -->
            <div class="kpi-card">
                <div class="psp-header bg-etiquetado">
                    <span>3. ETIQUETADO</span>
                    <span id="label-etiquetado" class="text-[10px] bg-black/20 px-2 py-1 rounded">0</span>
                </div>
                <div class="table-container">
                    <table id="table-etiquetado">
                        <thead>
                            <tr>
                                <th onclick="sortTable('etiquetado', 0)">Nombre</th>
                                <th onclick="sortTable('etiquetado', 1)">Rango</th>
                                <th onclick="sortTable('etiquetado', 2)" class="text-center">Paq</th>
                                <th onclick="sortTable('etiquetado', 3)" class="text-center">Err</th>
                                <th onclick="sortTable('etiquetado', 4)" class="text-center">Ef%</th>
                                <th onclick="sortTable('etiquetado', 5)" class="text-center">PPH</th>
                                <th onclick="sortTable('etiquetado', 6)" class="text-center">Días</th>
                            </tr>
                        </thead>
                        <tbody id="body-etiquetado"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        const XLSX_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRrIh0lDXr8oz48UNU56X6iUV_f04YpsgwF8pULjOIrQ9tUREu0ehPoT2OHoDOVw1BCAS1VOndiU1ri/pub?output=xlsx';
        let rawRows = [];
        let tablesData = { muelle: [], inyeccion: [], etiquetado: [] };

        async function fetchExcel() {
            document.getElementById('loader').style.display = 'flex';
            try {
                const response = await fetch(XLSX_URL + '&cache=' + new Date().getTime());
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
                const sheetName = workbook.SheetNames.find(n => n.includes('Picking')) || workbook.SheetNames[0];
                rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });
                
                populateWeeks();
                processData();
            } catch (error) {
                console.error(error);
                alert("Error cargando el archivo");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function findKey(row, name) {
            if (!row) return "";
            const normalized = name.toLowerCase().replace(/\s/g, '');
            return Object.keys(row).find(k => k.toLowerCase().replace(/\s/g, '') === normalized) || "";
        }

        function populateWeeks() {
            const col = findKey(rawRows[0], 'Semana');
            const weeks = [...new Set(rawRows.map(r => r[col]).filter(w => w !== ""))].sort((a,b) => a-b);
            const select = document.getElementById('filter-semana');
            select.innerHTML = '<option value="all">Semanas</option>';
            weeks.forEach(w => select.innerHTML += `<option value="${w}">Semana ${w}</option>`);
        }

        function applyFilters() { processData(); }

        function processData() {
            const selectedWeek = document.getElementById('filter-semana').value;
            const groups = { muelle: {}, inyeccion: {}, etiquetado: {} };

            rawRows.forEach(row => {
                const colSemana = findKey(row, 'Semana');
                if (selectedWeek !== "all" && String(row[colSemana]) !== selectedWeek) return;

                const proceso = String(row[findKey(row, 'Proceso de Trabajo')]).toLowerCase();
                const nombre = String(row[findKey(row, 'Colaborador')]);
                if (!nombre || nombre === "") return;

                let type = "";
                if (proceso.includes('muelle')) type = 'muelle';
                else if (proceso.includes('inyeccion') || proceso.includes('inyección')) type = 'inyeccion';
                else if (proceso.includes('etiquetado')) type = 'etiquetado';

                if (type) {
                    if (!groups[type][nombre]) {
                        groups[type][nombre] = {
                            nombre, ranges: new Set(), rutas: 0, 
                            paquetes: 0, errores: 0, dias: new Set(), totalFilas: 0
                        };
                    }
                    const s = groups[type][nombre];
                    
                    const rVal = String(row[findKey(row, 'Rango de Trabajo')]);
                    rVal.split(',').forEach(l => { if(l.trim()) s.ranges.add(l.trim()); });

                    // Corregir Rutas de Muelle: Sumar columna "Rutas x Colaborador"
                    if (type === 'muelle') {
                        s.rutas += parseFloat(row[findKey(row, 'Rutas x Colaborador')]) || 0;
                    }

                    s.paquetes += parseFloat(row[findKey(row, 'Paquetes Procesados x Colaborador')]) || 0;
                    
                    if (type === 'inyeccion') s.errores += parseFloat(row[findKey(row, 'Paquetes Dañados/ SC')]) || 0;
                    else if (type === 'muelle') s.errores += parseFloat(row[findKey(row, 'Errores Muelle')]) || 0;
                    else s.errores += parseFloat(row[findKey(row, 'Errores Etiquetado')]) || 0;

                    if (row[findKey(row, 'Fecha')]) s.dias.add(row[findKey(row, 'Fecha')]);
                    s.totalFilas++;
                }
            });

            Object.keys(groups).forEach(type => {
                tablesData[type] = Object.values(groups[type]).map(s => {
                    // Si hay errores, no redondear a 100% (Usar 99.9 si es necesario pero no 100)
                    let ef = s.paquetes > 0 ? ((s.paquetes - s.errores) / s.paquetes) * 100 : 0;
                    if (s.errores > 0 && ef > 99.9) ef = 99.9; 

                    return {
                        nombre: s.nombre,
                        rango: Array.from(s.ranges).join(','),
                        rutas: s.rutas,
                        paquetes: s.paquetes,
                        errores: s.errores,
                        eficiencia: ef,
                        pph: Math.round(s.paquetes / (s.totalFilas || 1)),
                        numDias: s.dias.size
                    };
                }).sort((a, b) => b.eficiencia - a.eficiencia);
                renderTable(type);
            });
        }

        function getEfColor(ef) {
            if (ef >= 100) return 'text-green-400';
            if (ef >= 98) return 'text-yellow-400';
            return 'text-red-500';
        }

        function renderTable(type) {
            document.getElementById(`label-${type}`).innerText = tablesData[type].length;
            const body = document.getElementById(`body-${type}`);
            body.innerHTML = tablesData[type].map(s => `
                <tr>
                    <td class="font-bold text-white">${s.nombre}</td>
                    <td class="text-[10px] text-gray-500">${s.rango}</td>
                    ${type === 'muelle' ? `<td class="text-center font-bold text-blue-400">${s.rutas}</td>` : ''}
                    <td class="text-center font-bold text-emerald-400">${s.paquetes.toLocaleString()}</td>
                    <td class="text-center text-red-400">${s.errores}</td>
                    <td class="text-center">
                        <span class="status-badge ${getEfColor(s.eficiencia)}">
                            ${s.eficiencia.toFixed(1)}%
                        </span>
                    </td>
                    <td class="text-center text-white font-bold">${s.pph}</td>
                    <td class="text-center opacity-60">${s.numDias}</td>
                </tr>
            `).join('');
        }

        function sortTable(type, colIndex) {
            const keys = type === 'muelle' 
                ? ['nombre', 'rango', 'rutas', 'paquetes', 'errores', 'eficiencia', 'pph', 'numDias']
                : ['nombre', 'rango', 'paquetes', 'errores', 'eficiencia', 'pph', 'numDias'];
            
            const key = keys[colIndex];
            const isAsc = this[type + '_sort'] === key;
            
            tablesData[type].sort((a, b) => {
                let valA = a[key];
                let valB = b[key];
                if (typeof valA === 'string') return isAsc ? valB.localeCompare(valA) : valA.localeCompare(valB);
                return isAsc ? valA - valB : valB - valA;
            });

            this[type + '_sort'] = isAsc ? null : key;
            renderTable(type);
        }

        window.onload = fetchExcel;
    </script>
</body>
</html>
